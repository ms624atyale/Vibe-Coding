<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 음성 받아쓰기 (Whisper Large v3)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 text-slate-800">

    <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-100">
        <!-- 헤더 -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">🎙️ AI 음성 받아쓰기</h1>
            <p class="text-sm text-slate-500 mt-1">OpenAI Whisper Large v3 (Hugging Face API)</p>
        </div>

        <!-- API 토큰 입력란 -->
        <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
            <label for="hfToken" class="block text-xs font-semibold text-slate-600 mb-1">
                Hugging Face Access Token (User / Inference Token)
            </label>
            <input type="password" id="hfToken" placeholder="hf_xxxxxxxxxxxxxxxxxxxxxxxx"
                   class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
            <p class="text-[11px] text-slate-400 mt-1">* 토큰은 서버에 저장되지 않고 웹브라우저 메모리에서만 사용됩니다.</p>
        </div>

        <!-- 컨트롤 영역 (녹음 버튼 및 상태) -->
        <div class="flex flex-col items-center justify-center gap-4 mb-6">
            <button id="recordBtn" onclick="toggleRecording()" 
                    class="relative w-20 h-20 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white flex items-center justify-center shadow-lg hover:shadow-indigo-200 transition-all duration-200 group">
                <span id="micIcon" class="text-3xl">🎙️</span>
                <!-- 녹음 진행 중 펄스 애니메이션 (숨김 상태 기본) -->
                <span id="pulseRing" class="hidden absolute inset-0 rounded-full bg-red-400 opacity-75 animate-ping"></span>
            </button>
            
            <div class="text-center">
                <span id="statusText" class="text-sm font-medium text-slate-600">버튼을 눌러 녹음을 시작하세요</span>
                <span id="timerText" class="block text-xs text-slate-400 mt-0.5 font-mono">00:00</span>
            </div>

            <!-- 녹음된 오디오 플레이어 (녹음 완료 후 표시) -->
            <audio id="audioPlayback" controls class="hidden w-full mt-2 rounded-lg"></audio>
        </div>

        <!-- 결과 출력 영역 -->
        <div>
            <div class="flex items-center justify-between mb-2">
                <label class="text-xs font-semibold text-slate-600">변환된 텍스트 결과</label>
                <button id="copyBtn" onclick="copyResult()" class="hidden text-xs text-indigo-600 hover:underline">복사하기</button>
            </div>
            <div id="resultBox" class="w-full min-h-[120px] p-4 bg-slate-50 border border-slate-200 rounded-xl text-sm leading-relaxed text-slate-700 whitespace-pre-wrap break-words">
                녹음이 끝나면 변환된 텍스트가 이곳에 표시됩니다.
            </div>
        </div>
    </div>

    <script>
        // 변수 설정
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let timerInterval;
        let secondsElapsed = 0;
        let audioBlob = null;

        const MODEL_ID = "openai/whisper-large-v3";

        // DOM 요소
        const recordBtn = document.getElementById("recordBtn");
        const micIcon = document.getElementById("micIcon");
        const pulseRing = document.getElementById("pulseRing");
        const statusText = document.getElementById("statusText");
        const timerText = document.getElementById("timerText");
        const audioPlayback = document.getElementById("audioPlayback");
        const resultBox = document.getElementById("resultBox");
        const copyBtn = document.getElementById("copyBtn");
        const hfTokenInput = document.getElementById("hfToken");

        // 녹음 시작/중지 토글
        async function toggleRecording() {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        }

        // 녹음 시작
        async function startRecording() {
            const token = hfTokenInput.value.trim();
            if (!token) {
                alert("Hugging Face Access Token을 입력해주세요!");
                hfTokenInput.focus();
                return;
            }

            try {
                // 마이크 권한 요청
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    // 녹음 데이터를 오디오 Blob(wav/webm) 객체로 변환
                    audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                    
                    // 녹음된 오디오 미리듣기 설정
                    const audioUrl = URL.createObjectURL(audioBlob);
                    audioPlayback.src = audioUrl;
                    audioPlayback.classList.remove("hidden");

                    // Hugging Face API 전송
                    await sendAudioToHuggingFace(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;

                // UI 업데이트
                recordBtn.classList.remove("bg-indigo-600", "hover:bg-indigo-700");
                recordBtn.classList.add("bg-red-500", "hover:bg-red-600");
                micIcon.innerText = "⏹️";
                pulseRing.classList.remove("hidden");
                statusText.innerText = "녹음 중... (다시 눌러 완료)";
                statusText.classList.add("text-red-500");
                resultBox.innerText = "녹음 중입니다...";

                // 타이머 시작
                secondsElapsed = 0;
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                    const secs = String(secondsElapsed % 60).padStart(2, '0');
                    timerText.innerText = `${mins}:${secs}`;
                }, 1000);

            } catch (err) {
                alert("마이크 접근에 실패했습니다: " + err.message);
            }
        }

        // 녹음 중지
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                // 마이크 트랙 종료 (권한 해제)
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                isRecording = false;

                // UI 및 타이머 복구
                clearInterval(timerInterval);
                recordBtn.classList.remove("bg-red-500", "hover:bg-red-600");
                recordBtn.classList.add("bg-indigo-600", "hover:bg-indigo-700");
                micIcon.innerText = "🎙️";
                pulseRing.classList.add("hidden");
                statusText.innerText = "음성을 AI로 분석하는 중...";
                statusText.classList.remove("text-red-500");
            }
        }

        // Hugging Face API로 음성 파일 전송 (Whisper Large v3)
        async function sendAudioToHuggingFace(blob) {
            const token = hfTokenInput.value.trim();
            resultBox.innerText = "⏳ Whisper Large v3 모델에 음성 데이터를 보내 텍스트로 변환하고 있습니다...\n(무료 Serverless API 특성상 첫 호출 시 10~20초 정도 걸릴 수 있습니다.)";

            try {
                // Whisper API 호출 (바이너리 오디오 Blob 전송)
                const response = await fetch(`https://api-inference.huggingface.co/models/${MODEL_ID}`, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": blob.type // audio/webm 또는 audio/wav
                    },
                    body: blob
                });

                const data = await response.json();

                if (response.ok && data.text) {
                    resultBox.innerText = data.text;
                    statusText.innerText = "변환 완료!";
                    copyBtn.classList.remove("hidden");
                } else if (data.error) {
                    // 모델이 로딩 중이거나 에러 발생 시
                    if (data.error.includes("currently loading")) {
                        resultBox.innerText = "⚠️ 모델이 수면 상태에서 깨어나는 중입니다(Cold Start).\n약 20초 후 녹음을 다시 시도해 주세요.";
                    } else {
                        resultBox.innerText = `❌ API 오류 발생: ${data.error}`;
                    }
                    statusText.innerText = "오류 발생";
                } else {
                    resultBox.innerText = "❌ 음성을 인식하지 못했거나 응답 형식이 올바르지 않습니다.\n" + JSON.stringify(data);
                    statusText.innerText = "변환 실패";
                }
            } catch (err) {
                resultBox.innerText = "❌ 통신 에러가 발생했습니다: " + err.message;
                statusText.innerText = "에러 발생";
            }
        }

        // 결과 텍스트 복사 기능
        function copyResult() {
            navigator.clipboard.writeText(resultBox.innerText);
            alert("텍스트가 클립보드에 복사되었습니다!");
        }
    </script>
</body>
</html>
